<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Dossie executivo do projeto de captacao presencial da V3 Prev.">
<title>Dossiê Vivo da Captação Presencial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{color-scheme:light dark}
html,body{margin:0;padding:0}
img{max-width:100%}
[hidden]{display:none!important}

:root{
  --bg:#F4F5F3; --surface:#FFFFFF; --surface-2:#ECEEEC; --surface-3:#E2E5E3;
  --line:#DBDFDC; --line-2:#C4CAC6; --line-3:#A9B1AD;
  --text:#141A18; --text-2:#495451; --text-3:#77827E;
  --accent:#1D5FA8; --accent-2:#164C86; --accent-soft:#E4EDF7; --accent-line:#B9CFE7;
  --ok:#31804F; --ok-soft:#E3F0E8;
  --warn:#B0740A; --warn-soft:#F6EDDC;
  --crit:#AE2E24; --crit-soft:#F7E4E1;
  --idle:#7B858A; --idle-soft:#EAECEB;
  --shadow-1:0 1px 2px rgba(16,28,24,.05);
  --shadow-2:0 6px 20px -8px rgba(16,28,24,.18);
  --r:10px; --r-sm:6px;
  --sans:"IBM Plex Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --display:"Archivo","IBM Plex Sans",-apple-system,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1214; --surface:#151B1E; --surface-2:#1B2327; --surface-3:#222C31;
    --line:#263236; --line-2:#35444A; --line-3:#4A5C62;
    --text:#E9EDEC; --text-2:#A6B2B2; --text-3:#7A8789;
    --accent:#4E97DE; --accent-2:#7DB4E8; --accent-soft:#152B41; --accent-line:#27466A;
    --ok:#3FA46E; --ok-soft:#132A20;
    --warn:#E0A93E; --warn-soft:#2E2415;
    --crit:#E0655A; --crit-soft:#331A18;
    --idle:#7A8789; --idle-soft:#1E2629;
    --shadow-1:0 1px 2px rgba(0,0,0,.3);
    --shadow-2:0 8px 26px -10px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0E1214; --surface:#151B1E; --surface-2:#1B2327; --surface-3:#222C31;
  --line:#263236; --line-2:#35444A; --line-3:#4A5C62;
  --text:#E9EDEC; --text-2:#A6B2B2; --text-3:#7A8789;
  --accent:#4E97DE; --accent-2:#7DB4E8; --accent-soft:#152B41; --accent-line:#27466A;
  --ok:#3FA46E; --ok-soft:#132A20;
  --warn:#E0A93E; --warn-soft:#2E2415;
  --crit:#E0655A; --crit-soft:#331A18;
  --idle:#7A8789; --idle-soft:#1E2629;
  --shadow-1:0 1px 2px rgba(0,0,0,.3);
  --shadow-2:0 8px 26px -10px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);margin:0;text-wrap:balance;letter-spacing:-.015em;line-height:1.15}
p{margin:0}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{border-right:1px solid var(--line);background:var(--surface);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;overflow:hidden}
.rail-top{padding:18px 18px 14px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.03em}
.brand span{color:var(--accent)}
.brand-sub{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--text-3);margin-top:5px}
.nav{flex:1;overflow-y:auto;padding:10px 10px 14px}
.nav button{display:flex;gap:9px;align-items:baseline;width:100%;text-align:left;background:none;border:0;padding:7px 9px;border-radius:var(--r-sm);color:var(--text-2);font-size:12.5px;font-weight:500;line-height:1.3}
.nav button:hover{background:var(--surface-2);color:var(--text)}
.nav button.on{background:var(--accent-soft);color:var(--accent-2);font-weight:600}
.nav .n{font-family:var(--mono);font-size:10px;color:var(--text-3);font-weight:500;flex:none;width:15px}
.nav button.on .n{color:var(--accent)}
.rail-foot{padding:10px;border-top:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
.main{min-width:0;display:flex;flex-direction:column}

/* ---------- topbar ---------- */
.topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:9px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.tb-strip{display:flex;gap:16px;flex-wrap:wrap;flex:1;min-width:0}
.tb-item{display:flex;flex-direction:column;gap:1px}
.tb-item .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--text-3)}
.tb-item .v{font-family:var(--display);font-weight:700;font-size:13.5px;font-variant-numeric:tabular-nums}
.tb-actions{display:flex;gap:6px}

/* ---------- buttons ---------- */
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:5px 11px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s}
.btn:hover{background:var(--surface-2);border-color:var(--line-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--text)}
.btn.sm{padding:3px 8px;font-size:11px}
.btn.danger:hover{color:var(--crit);border-color:var(--crit)}

/* ---------- page ---------- */
.page{padding:26px 26px 80px;max-width:1180px;width:100%}
.page-head{margin-bottom:22px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent);font-weight:500}
.page-head h1{font-size:27px;font-weight:700;margin-top:7px}
.page-head .lede{color:var(--text-2);margin-top:8px;max-width:64ch;font-size:13.5px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 20px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:7px 12px;font-size:12.5px;font-weight:500;color:var(--text-3);white-space:nowrap}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
section.blk{margin-bottom:28px}
.blk-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.blk-h h2{font-size:15px;font-weight:700;letter-spacing:-.01em}
.blk-h .hint{color:var(--text-3);font-size:11.5px}

/* ---------- surfaces ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:900px){.g3,.g4,.g5{grid-template-columns:repeat(2,minmax(0,1fr))}.g2{grid-template-columns:1fr}}
@media(max-width:560px){.g2,.g3,.g4,.g5{grid-template-columns:1fr}}

/* KPI tiles */
.kpis{display:grid;gap:0;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.kpi{padding:14px 16px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0}
.kpi .k{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.kpi .v{font-family:var(--display);font-weight:700;font-size:24px;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.kpi .s{font-size:11.5px;color:var(--text-2)}
.kpi.ok .v{color:var(--ok)} .kpi.warn .v{color:var(--warn)} .kpi.crit .v{color:var(--crit)}

/* status pill */
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:100px;padding:2px 9px;font-size:11px;font-weight:600;font-family:var(--sans);white-space:nowrap;border:1px solid transparent}
.pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.ok{color:var(--ok);background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 25%,transparent)}
.pill.warn{color:var(--warn);background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 25%,transparent)}
.pill.crit{color:var(--crit);background:var(--crit-soft);border-color:color-mix(in srgb,var(--crit) 25%,transparent)}
.pill.idle{color:var(--idle);background:var(--idle-soft);border-color:color-mix(in srgb,var(--idle) 25%,transparent)}
.pill.run{color:var(--accent);background:var(--accent-soft);border-color:var(--accent-line)}

/* progress */
.bar{height:7px;border-radius:100px;background:var(--surface-3);overflow:hidden;position:relative}
.bar > i{display:block;height:100%;border-radius:100px;background:var(--accent);transition:width .35s ease}
.bar.ok > i{background:var(--ok)} .bar.warn > i{background:var(--warn)} .bar.crit > i{background:var(--crit)}
.bar .target{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text-2);border-radius:2px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);font-weight:500;text-align:left;padding:9px 11px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:7px 11px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
tbody tr:hover{background:var(--surface-2)}

/* inputs */
.f{width:100%;background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-sm);padding:5px 8px;font-size:12.5px;min-width:0}
.f:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
td .f{border-color:transparent;background:transparent;padding:3px 5px}
td .f:hover{border-color:var(--line-2)}
td .f:focus{background:var(--surface);border-color:var(--accent)}
textarea.f{resize:vertical;min-height:60px;line-height:1.45}
.f.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
label.fl{display:flex;flex-direction:column;gap:4px}
label.fl > span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.chk{display:flex;gap:9px;align-items:flex-start;padding:7px 9px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);margin-bottom:6px}
.chk:hover{border-color:var(--line-2)}
.chk input[type=checkbox]{margin-top:2px;width:15px;height:15px;accent-color:var(--accent);flex:none}
.chk .t{flex:1;min-width:0}
.chk .t .ti{font-weight:500}
.chk.done .t .ti{color:var(--text-3);text-decoration:line-through}
.chk .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.chk .meta .f{width:auto;max-width:170px;font-size:11.5px;padding:2px 6px}

.empty{color:var(--text-3);font-size:12.5px;padding:14px;text-align:center;border:1px dashed var(--line-2);border-radius:var(--r)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--text-2)}
.dim{color:var(--text-3)}
.tiny{font-size:11px}
.lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--text-3)}
.hr{height:1px;background:var(--line);margin:18px 0}
.tag{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:4px;background:var(--surface-2);border:1px solid var(--line);color:var(--text-2)}

/* ---------- capa ---------- */
.cover{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--surface);box-shadow:var(--shadow-2)}
.cover-top{padding:30px 30px 26px;border-bottom:1px solid var(--line);background:
  radial-gradient(120% 140% at 100% 0%, var(--accent-soft) 0%, transparent 58%)}
.cover-top .co-brand{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600}
.cover-top h1{font-size:clamp(28px,4.2vw,42px);font-weight:800;letter-spacing:-.035em;margin-top:12px;max-width:16ch}
.cover-top .co-sub{font-size:14.5px;color:var(--text-2);margin-top:10px;max-width:56ch}
.cover-strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
@media(max-width:900px){.cover-strip{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:560px){.cover-strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.cover-strip .kpi{border-bottom:0}
.cover-strip .kpi:last-child{border-right:0}
.where{padding:18px 30px;border-top:1px solid var(--line);background:var(--surface-2)}
.where .lbl{margin-bottom:6px}
.where p{font-family:var(--display);font-weight:600;font-size:16.5px;line-height:1.4;letter-spacing:-.01em;max-width:78ch}

/* insight cards */
.insight{border:1px solid var(--line);border-left:3px solid var(--line-2);border-radius:var(--r);padding:14px 16px;background:var(--surface)}
.insight.att{border-left-color:var(--crit)}
.insight.opp{border-left-color:var(--ok)}
.insight h3{font-size:12px;font-family:var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--text-3);font-weight:500}
.insight p{margin-top:8px;font-size:13.5px;line-height:1.5}

/* next actions */
.next{list-style:none;padding:0;margin:0;counter-reset:na}
.next li{display:flex;gap:11px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
.next li:last-child{border-bottom:0}
.next li::before{counter-increment:na;content:counter(na);font-family:var(--mono);font-size:10px;color:var(--text-3);border:1px solid var(--line-2);border-radius:5px;width:19px;height:19px;display:grid;place-items:center;flex:none;margin-top:1px}
.next .ttl{font-weight:500;font-size:13px}
.next .sub{font-size:11.5px;color:var(--text-3);margin-top:2px}

/* roadmap */
.phases{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.ph{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);text-align:left;background:none;border-left:0;border-right:0;border-top:0;width:100%}
.ph:last-child{border-bottom:0}
.ph:hover{background:var(--surface-2)}
.ph.on{background:var(--accent-soft)}
.ph .idx{font-family:var(--mono);font-size:10px;color:var(--text-3);letter-spacing:.06em}
.ph .nm{font-family:var(--display);font-weight:600;font-size:14px}
.ph .pr{margin-top:6px;display:flex;gap:9px;align-items:center}
.ph .pr .bar{flex:1;max-width:220px}
.ph .pr .pc{font-family:var(--mono);font-size:10.5px;color:var(--text-3)}
.ph-detail{border:1px solid var(--accent-line);border-radius:var(--r);background:var(--surface);padding:18px;margin-top:14px}

/* gantt */
.gantt{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow-x:auto}
.gantt table{min-width:760px}
.gtrack{position:relative;height:16px;background:var(--surface-3);border-radius:4px;min-width:220px}
.gtrack > i{position:absolute;top:0;bottom:0;border-radius:4px;background:var(--accent);opacity:.85}
.gtrack > i.ok{background:var(--ok)} .gtrack > i.warn{background:var(--warn)} .gtrack > i.crit{background:var(--crit)} .gtrack > i.idle{background:var(--line-3)}
.gtoday{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--crit)}

/* milestones */
.ms{display:flex;flex-direction:column;gap:0;padding-left:6px}
.ms .m{display:grid;grid-template-columns:22px 1fr auto;gap:12px;align-items:center;padding:10px 0;position:relative}
.ms .m::before{content:"";position:absolute;left:10px;top:0;bottom:0;width:1px;background:var(--line)}
.ms .m:first-child::before{top:50%} .ms .m:last-child::before{bottom:50%}
.ms .m .node{width:11px;height:11px;border-radius:50%;border:2px solid var(--line-2);background:var(--surface);z-index:1;margin-left:5px}
.ms .m.done .node{background:var(--ok);border-color:var(--ok)}
.ms .m.now .node{background:var(--accent);border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}

/* funnel / theory */
.theory{display:flex;flex-direction:column;gap:0}
.theory .step{display:grid;grid-template-columns:118px 1fr;gap:16px;align-items:center;padding:11px 14px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);position:relative}
.theory .arrow{height:16px;display:grid;place-items:center;color:var(--line-3);font-size:11px}
.theory .step .st{font-family:var(--mono);font-size:10px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent)}
.theory .step .sd{font-size:12.5px;color:var(--text-2)}
.theory .step.ext{border-style:dashed;background:var(--surface-2)}
.theory .step.ext .st{color:var(--text-3)}

/* score */
.score{font-family:var(--display);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}

/* rec cards */
.rec{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.rec + .rec{margin-top:12px}
.rec-h{padding:12px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.rec-h .t{font-family:var(--display);font-weight:600;font-size:13.5px}
.rec-b{padding:14px 16px;display:grid;gap:12px}
.qa{display:grid;grid-template-columns:150px 1fr;gap:12px;align-items:start}
@media(max-width:640px){.qa{grid-template-columns:1fr;gap:3px}}
.qa .q{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3);padding-top:2px}
.qa .a{font-size:13px;line-height:1.5}
.rec-f{padding:10px 16px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.why{font-size:11.5px;color:var(--text-3);font-style:normal;border-left:2px solid var(--line-2);padding-left:9px}

/* comparison rows */
.cmp{display:grid;grid-template-columns:1fr;gap:0;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--surface)}
.cmp .row{display:grid;grid-template-columns:150px 1fr 92px 92px 74px;gap:12px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line)}
.cmp .row:last-child{border-bottom:0}
.cmp .row.head{background:var(--surface-2);padding-top:8px;padding-bottom:8px}
.cmp .row.head span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--text-3)}
.cmp .nm{font-weight:500;font-size:12.5px}
.cmp .num{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;font-size:12.5px}
@media(max-width:760px){.cmp .row{grid-template-columns:1fr 1fr;row-gap:6px}.cmp .row.head{display:none}.cmp .bar{grid-column:1/-1}}

/* report */
.report{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:34px 40px;max-width:900px}
.report h2{font-size:19px;margin:28px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.report h2:first-of-type{margin-top:0}
.report p{margin:8px 0;line-height:1.6;max-width:68ch}
.report ul{margin:8px 0;padding-left:20px;line-height:1.6}
@media(max-width:640px){.report{padding:22px 18px}}

/* presentation */
.present{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column}
.present-body{flex:1;overflow-y:auto;display:flex;align-items:center;justify-content:center;padding:44px 6vw}
.slide{width:100%;max-width:1080px}
.slide .s-eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:600}
.slide h1{font-size:clamp(30px,5vw,54px);font-weight:800;letter-spacing:-.035em;margin-top:14px}
.slide h2{font-size:clamp(22px,3.4vw,34px);font-weight:700;letter-spacing:-.03em;margin-top:12px}
.slide .s-body{margin-top:26px;font-size:clamp(14px,1.5vw,17px);line-height:1.6}
.slide .s-body p{margin:10px 0;max-width:70ch}
.slide .s-body li{margin:7px 0}
.present-foot{border-top:1px solid var(--line);padding:10px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface)}
.present-foot .pg{font-family:var(--mono);font-size:11px;color:var(--text-3)}

/* toast */
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:200;background:var(--text);color:var(--bg);padding:9px 16px;border-radius:100px;font-size:12.5px;font-weight:500;box-shadow:var(--shadow-2);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}

/* demo banner */
.demo-banner{background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);color:var(--warn);border-radius:var(--r);padding:9px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:18px;font-size:12.5px;font-weight:500}

/* mobile */
.mobile-nav{display:none}
@media(max-width:840px){
  #app{grid-template-columns:1fr}
  .rail{display:none}
  .mobile-nav{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--surface);position:sticky;top:0;z-index:40}
  .mobile-nav select{flex:1}
  .page{padding:18px 16px 70px}
  .topbar{padding:9px 16px}
  .cover-top{padding:22px 20px}
  .where{padding:16px 20px}
}
@media print{
  .rail,.topbar,.tabs,.mobile-nav,.btn,.demo-banner{display:none!important}
  #app{display:block}
  .page{padding:0;max-width:none}
  .report{border:0;padding:0}
  body{background:#fff;color:#000}
}

/* ---------- login ---------- */
#login{position:fixed;inset:0;z-index:500;background:var(--bg);display:grid;place-items:center;padding:24px;overflow-y:auto}
.lg-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:30px;box-shadow:var(--shadow-2)}

/* ---------- somente leitura ---------- */

    const cfg = window.DOSSIE_CONFIG || {};
    if(!cfg.supabaseUrl || !cfg.supabaseAnonKey || /COLE_AQUI/.test(String(cfg.supabaseUrl)+String(cfg.supabaseAnonKey))){
      return Login.erroConfig();
    }
    if(!(await carregarSupabase())) return Login.erroBiblioteca();
    try{
      this.sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseAnonKey);
    }catch(e){ return Login.erroConfig(e.message); }

    this.sb.auth.onAuthStateChange((evt, session)=>{
      if(evt === "SIGNED_OUT"){ location.reload(); }
    });
    const { data } = await this.sb.auth.getSession();
    if(data && data.session) return this.entrar(data.session);
    Login.mostrar();
  },

  async entrar(session){
    this.user = session.user;
    Login.carregando("Verificando seu acesso…");
    const { data: membro, error } = await this.sb.from("membros").select("*").eq("email", this.user.email).maybeSingle();
    if(error){ return Login.semAcesso(this.user.email, error.message); }
    if(!membro){ return Login.semAcesso(this.user.email); }
    this.membro = membro;
    if(membro.papel === "leitor") document.body.classList.add("somente-leitura");
    Login.carregando("Carregando o dossiê…");
    await this.carregar();
    this.assinar();
    this.ready = true;
    Login.esconder();
    App.boot();
  },

  async carregar(){
    const { data, error } = await this.sb.from("dossie_docs").select("chave,conteudo,atualizado_por,atualizado_em");
    if(error){ toast("Não foi possível carregar: "+error.message); return; }
    (data||[]).forEach(r=>{ if(DOC_KEYS.indexOf(r.chave)>=0 && r.conteudo) this.data[r.chave] = r.conteudo; });
    await this.carregarHistorico();
  },

  async carregarHistorico(){
    const { data } = await this.sb.from("dossie_historico").select("chave,email,em").order("em",{ascending:false}).limit(8);
    this.historico = data || [];
  },

  assinar(){
    try{
      this.sb.channel("dossie-docs")
        .on("postgres_changes", {event:"*", schema:"public", table:"dossie_docs"}, payload=>{
          const r = payload.new; if(!r || DOC_KEYS.indexOf(r.chave)<0) return;
          if(r.atualizado_por === (this.user&&this.user.email) && Date.now()-this._ultimoSave < 4000) return;
          this.data[r.chave] = r.conteudo;
          this.carregarHistorico().then(()=>{ if(this.ready) App.onRemote(r.chave); });
        })
        .subscribe();
    }catch(e){ /* sem tempo real: os dados continuam sendo salvos */ }
  },

  save(key, immediate){
    if(!this.sb || !this.ready) return;
    if(this.timers[key]) clearTimeout(this.timers[key]);
    const run = async ()=>{
      this._ultimoSave = Date.now();
      const { error } = await this.sb.from("dossie_docs").upsert({
        chave: key, conteudo: this.data[key],
        atualizado_por: this.user.email, atualizado_em: new Date().toISOString()
      }, { onConflict:"chave" });
      if(error) toast("Não foi possível salvar: "+error.message);
      else { App.marcarSalvo(); this.carregarHistorico(); }
    };
    if(immediate) run(); else this.timers[key] = setTimeout(run, 800);
  },
  saveAll(){ DOC_KEYS.forEach(k=>this.save(k,true)); },
  async sair(){ try{ await this.sb.auth.signOut(); }catch(e){} location.reload(); }
};
const S = ()=> Store.data;

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove("on"),2600); }

/* ============================================================
   CÁLCULOS DERIVADOS
   ============================================================ */
const SCORE_W = {fluxo:30, hospital:20, perfil:25, seguranca:10, operacional:15};
function localScore(l){
  let s=0, wsum=0;
  for(const k in SCORE_W){ const v = clamp(num(l[k]),0,5); s += (v/5)*SCORE_W[k]; wsum += SCORE_W[k]; }
  return Math.round(s);
}
function localClass(sc){
  if(sc>=80) return {l:"EXCELENTE", c:"ok"};
  if(sc>=65) return {l:"ALTO", c:"ok"};
  if(sc>=50) return {l:"TESTAR", c:"run"};
  if(sc>=35) return {l:"BAIXO", c:"warn"};
  return {l:"DESCARTAR", c:"crit"};
}

function D(){
  const s = S(), pr = s.premissas, fases = s.fases.lista, di = s.piloto.diario;
  const t = today();

  /* tarefas */
  let tot=0, done=0, late=0, doing=0;
  const lateList=[], nextList=[];
  fases.forEach((f,fi)=>{
    (f.tarefas||[]).forEach(tk=>{
      tot++;
      if(tk.status==="concluido") done++;
      else {
        if(tk.status==="em_andamento") doing++;
        if(tk.prazo && tk.prazo < t){ late++; lateList.push({fase:f, fi, t:tk}); }
        else nextList.push({fase:f, fi, t:tk});
      }
    });
  });
  const progresso = tot? Math.round(done/tot*100) : 0;

  /* fase atual */
  let faseAtual = fases.find(f=> f.status==="em_andamento");
  if(!faseAtual) faseAtual = fases.find(f=> (f.tarefas||[]).some(x=>x.status!=="concluido"));
  if(!faseAtual) faseAtual = fases[fases.length-1];
  const faseIdx = fases.indexOf(faseAtual);
  const faseProg = fp => { const ts=fp.tarefas||[]; return ts.length? Math.round(ts.filter(x=>x.status==="concluido").length/ts.length*100):0; };

  /* piloto realizado */
  const agg = di.reduce((a,d)=>{
    a.leads+=num(d.leads); a.qualificados+=num(d.qualificados); a.triagens+=num(d.triagens);
    a.pastas+=num(d.pastas); a.custo+=num(d.investimento); a.dias++;
    a.captadoresMax = Math.max(a.captadoresMax, num(d.captadores));
    return a;
  },{leads:0,qualificados:0,triagens:0,pastas:0,custo:0,dias:0,captadoresMax:0});

  const invPrev = s.investimento.itens.reduce((a,i)=>a+num(i.previsto),0);
  const invReal = s.investimento.itens.reduce((a,i)=>a+num(i.realizado),0) + agg.custo;
  const orcamento = num(pr.orcamento) || invPrev;

  const meses = num(pr.duracaoPiloto)/30 || 1;
  const capt = num(pr.numCaptadores) || 1;
  const metaPastas = Math.round(capt * num(pr.metaPastasCaptadorMes) * meses);
  const metaLeads = Math.round(capt * num(pr.metaLeadsCaptadorMes) * meses);
  const metaReceita = metaPastas * num(pr.receitaPorPasta);
  const metaQualificados = Math.round(metaLeads * num(pr.convLeadQualificado)/100);
  const metaTriagens = Math.round(metaQualificados * num(pr.convQualificadoTriagem)/100);

  const receita = agg.pastas * num(pr.receitaPorPasta);
  const cac = agg.pastas>0 ? invReal/agg.pastas : 0;
  const roi = invReal>0 ? (receita-invReal)/invReal*100 : 0;
  const prodCaptador = capt>0 ? agg.pastas/capt : 0;
  const convLeadPasta = agg.leads>0 ? agg.pastas/agg.leads*100 : 0;

  /* por local */
  const porLocal = {};
  di.forEach(d=>{
    const k = (d.local||"Não informado").trim() || "Não informado";
    if(!porLocal[k]) porLocal[k] = {local:k, leads:0, qualificados:0, triagens:0, pastas:0, custo:0, dias:0};
    const o = porLocal[k];
    o.leads+=num(d.leads); o.qualificados+=num(d.qualificados); o.triagens+=num(d.triagens);
    o.pastas+=num(d.pastas); o.custo+=num(d.investimento); o.dias++;
  });
  const locais = Object.values(porLocal).map(o=>{
    o.cac = o.pastas>0 ? o.custo/o.pastas : 0;
    o.conv = o.leads>0 ? o.pastas/o.leads*100 : 0;
    o.receita = o.pastas*num(pr.receitaPorPasta);
    return o;
  }).sort((a,b)=>b.pastas-a.pastas);
  const cacMedioLocais = locais.filter(l=>l.cac>0);
  const cacMedio = cacMedioLocais.length ? cacMedioLocais.reduce((a,l)=>a+l.cac,0)/cacMedioLocais.length : 0;

  /* prazo */
  const fim = fases.length? fases[fases.length-1].fim : "";
  const diasRestantes = fim ? daysBetween(t, fim) : 0;
  const inicio = pr.dataInicio || BASE_START;
  const totalDias = fim? Math.max(1, daysBetween(inicio, fim)) : 1;
  const decorridos = clamp(daysBetween(inicio, t), 0, totalDias);
  const progressoEsperado = Math.round(decorridos/totalDias*100);

  /* semáforos */
  const sem = (real, meta, maiorMelhor)=>{
    if(!meta) return "idle";
    const r = maiorMelhor ? real/meta : (real>0? meta/real : 0);
    if(r>=0.95) return "ok"; if(r>=0.8) return "warn"; return "crit";
  };
  const semPastas = agg.dias? sem(agg.pastas, metaPastas, true) : "idle";
  const semCac = agg.pastas>0 ? (cac<=num(pr.cacMax)?"ok": cac<=num(pr.cacMax)*1.2?"warn":"crit") : "idle";
  const semRoi = invReal>0 ? (roi>=0?"ok": roi>=-25?"warn":"crit") : "idle";
  const semOrc = orcamento>0 ? (invReal<=orcamento?"ok": invReal<=orcamento*1.1?"warn":"crit") : "idle";
  const semPrazo = late===0 ? "ok" : late<=2 ? "warn":"crit";
  const semProg = progresso>=progressoEsperado-5 ? "ok" : progresso>=progressoEsperado-20 ? "warn":"crit";

  const semafaros = [semPastas,semCac,semRoi,semOrc,semPrazo,semProg];
  let statusGeral = "ok";
  if(semafaros.includes("crit")) statusGeral = "crit";
  else if(semafaros.includes("warn")) statusGeral = "warn";
  if(s.geral.statusManual && s.geral.statusManual!=="auto") statusGeral = s.geral.statusManual;

  /* próximo marco */
  const marcoProx = (s.marcos.lista||[]).find(m=>m.status!=="concluido");

  return {pr, fases, faseAtual, faseIdx, faseProg, tot, done, late, doing, progresso, progressoEsperado,
    lateList, nextList, agg, invPrev, invReal, orcamento, metaPastas, metaLeads, metaReceita, metaQualificados, metaTriagens,
    receita, cac, roi, prodCaptador, convLeadPasta, locais, cacMedio, diasRestantes, fim, inicio, totalDias, decorridos,
    semPastas, semCac, semRoi, semOrc, semPrazo, semProg, statusGeral, marcoProx, sem};
}

/* frase "onde estamos" */
function ondeEstamos(d){
  const s = S();
  const partes = [];
  const nomeFase = "Fase "+d.faseAtual.num+" — "+d.faseAtual.nome.toLowerCase();
  partes.push("O projeto está na "+nomeFase+", com "+d.progresso+"% das "+d.tot+" tarefas concluídas");
  const locs = s.territorios.locais||[];
  if(locs.length){
    const aptos = locs.filter(l=>localScore(l)>=50).length;
    partes.push(locs.length+" locais avaliados e "+aptos+" com potencial suficiente para teste");
  }
  if(d.agg.dias>0){
    partes.push(d.agg.dias+" dias de piloto registrados, "+int(d.agg.pastas)+" pastas de uma meta de "+int(d.metaPastas));
  }
  if(d.late>0) partes.push(d.late+" tarefa"+(d.late>1?"s":"")+" em atraso");
  return partes.join("; ")+".";
}

/* ============================================================
   MOTOR DE RECOMENDAÇÃO — regras explícitas
   ============================================================ */
function motor(){
  const s = S(), d = D(), pr = d.pr, recs = [];
  const has = id => (s.acoes.lista||[]).some(a=>a.regra===id) || (s.acoes.recusadas||[]).includes(id);
  const add = r => { if(!has(r.id)) recs.push(r); };

  if(d.agg.dias>0 && d.metaPastas>0 && d.agg.pastas < d.metaPastas*0.8){
    const gap = Math.round((1-d.agg.pastas/d.metaPastas)*100);
    add({id:"R-PRODUCAO", grav:"crit", tema:"Conversão",
      oque:"Produção "+gap+"% abaixo da meta: "+int(d.agg.pastas)+" pastas contra "+int(d.metaPastas)+" previstas.",
      porque:"Com "+int(d.agg.leads)+" leads gerados e conversão de "+pct(d.convLeadPasta,1)+" de lead para pasta, o gargalo está mais na conversão do que no volume de abordagem." ,
      acao:"Acompanhar pessoalmente 2 turnos de cada captador em campo, gravar as objeções mais frequentes e ajustar o script nos pontos onde a conversa morre.",
      resp:"Diretor de Marketing", prazo:7, ind:"Conversão lead→pasta acima de "+pct(d.convLeadPasta+2,1)+" na semana seguinte",
      regra:"SE pastas < 80% da meta → investigar conversão em campo antes de aumentar equipe."});
  }
  if(d.agg.pastas>0 && d.cac > num(pr.cacMax)){
    const ac = Math.round((d.cac/num(pr.cacMax)-1)*100);
    add({id:"R-CAC", grav:d.cac>num(pr.cacMax)*1.2?"crit":"warn", tema:"Investimento",
      oque:"CAC em "+brl(d.cac)+", "+ac+"% acima do limite de "+brl(pr.cacMax)+".",
      porque:"O investimento realizado de "+brl(d.invReal)+" produziu "+int(d.agg.pastas)+" pastas. Ou o custo por dia de operação está alto para o volume, ou parte do esforço está em locais de baixo retorno.",
      acao:"Concentrar a operação nos locais de melhor CAC e suspender os dois piores por 7 dias, mantendo o mesmo custo diário total.",
      resp:"Diretor de Marketing", prazo:7, ind:"CAC ≤ "+brl(pr.cacMax)+" no ciclo seguinte",
      regra:"SE CAC > limite → reduzir custo ou mudar o ponto antes de ampliar."});
  }
  const piores = d.locais.filter(l=>l.cac>0 && d.cacMedio>0 && l.cac > d.cacMedio*1.25);
  piores.forEach(l=>{
    const ac = Math.round((l.cac/d.cacMedio-1)*100);
    add({id:"R-LOCAL-RUIM-"+l.local, grav:"warn", tema:"Local",
      oque:"O local "+l.local+" está com CAC "+ac+"% acima da média dos demais ("+brl(l.cac)+" contra "+brl(d.cacMedio)+").",
      porque:"Em "+l.dias+" dias de operação o local gerou "+int(l.leads)+" leads e "+int(l.pastas)+" pastas, com conversão de "+pct(l.conv,1)+".",
      acao:"Reduzir a exposição em "+l.local+" e deslocar essas horas para o local de melhor desempenho durante 7 dias.",
      resp:"Diretor de Marketing", prazo:7, ind:"CAC do ciclo ≤ "+brl(pr.cacMax)+" com o mesmo número de captadores",
      regra:"SE o CAC de um local > 125% da média → testar redistribuição antes de descartar o local."});
  });
  const melhor = d.locais.filter(l=>l.cac>0).sort((a,b)=>a.cac-b.cac)[0];
  if(melhor && d.cacMedio>0 && melhor.cac < d.cacMedio*0.8){
    const ab = Math.round((1-melhor.cac/d.cacMedio)*100);
    add({id:"R-LOCAL-BOM-"+melhor.local, grav:"ok", tema:"Local",
      oque:"O local "+melhor.local+" apresenta CAC "+ab+"% inferior à média ("+brl(melhor.cac)+").",
      porque:"Foram "+int(melhor.pastas)+" pastas em "+melhor.dias+" dias, com conversão de "+pct(melhor.conv,1)+" — acima do conjunto.",
      acao:"Ampliar a exposição em "+melhor.local+": acrescentar um turno por dia durante 5 dias úteis mantendo os demais locais como estão.",
      resp:"Diretor de Marketing", prazo:5, ind:"Pastas do local sobem sem que o CAC ultrapasse "+brl(pr.cacMax),
      regra:"SE o CAC de um local < 80% da média → testar aumento de exposição nesse ponto."});
  }
  if(d.orcamento>0 && d.invReal > d.orcamento){
    add({id:"R-ORCAMENTO", grav:"crit", tema:"Investimento",
      oque:"Investimento realizado de "+brl(d.invReal)+" supera o orçamento de "+brl(d.orcamento)+".",
      porque:"O desvio acumulado é de "+brl(d.invReal-d.orcamento)+" ("+pct((d.invReal/d.orcamento-1)*100,0)+").",
      acao:"Revisar linha a linha o orçamento na aba Investimento, congelar as categorias já estouradas e levar o novo valor para aprovação antes de novo desembolso.",
      resp:"Diretor Financeiro", prazo:5, ind:"Orçamento revisado e aprovado, sem novo desembolso fora dele",
      regra:"SE investimento > orçamento → revisar orçamento antes de continuar."});
  }
  if(d.late>0){
    add({id:"R-ATRASO", grav:d.late>3?"crit":"warn", tema:"Processo",
      oque:d.late+" tarefa"+(d.late>1?"s":"")+" com prazo vencido, com o projeto em "+d.progresso+"% contra "+d.progressoEsperado+"% esperados para a data.",
      porque:"O atraso se concentra "+(d.lateList.length?"na Fase "+d.lateList[0].fase.num+" — "+d.lateList[0].fase.nome:"nas fases iniciais")+".",
      acao:"Repactuar prazo e responsável de cada tarefa vencida na aba Plano de Ação e definir uma data única de recuperação.",
      resp:"Diretor de Marketing", prazo:3, ind:"Nenhuma tarefa vencida sem prazo repactuado",
      regra:"SE existem tarefas vencidas → repactuar prazos antes de avançar de fase."});
  }
  if(d.agg.dias>0 && d.prodCaptador>0 && num(pr.metaPastasCaptadorMes)>0){
    const espera = num(pr.metaPastasCaptadorMes)*(num(pr.duracaoPiloto)/30);
    if(d.prodCaptador < espera*0.8){
      add({id:"R-PRODUTIVIDADE", grav:"warn", tema:"Pessoas",
        oque:"Produtividade de "+d.prodCaptador.toFixed(1)+" pastas por captador contra "+espera.toFixed(1)+" esperadas no período.",
        porque:"A diferença entre os captadores costuma vir de abordagem, não de local; sem acompanhamento em campo não é possível separar os dois.",
        acao:"Fazer uma sessão de reciclagem de abordagem com todos os captadores e acompanhar em campo o de menor produtividade por dois turnos.",
        resp:"Diretor de Marketing", prazo:10, ind:"Produtividade média ≥ "+(espera*0.9).toFixed(1)+" pastas por captador no ciclo seguinte",
        regra:"SE produtividade < 80% da meta por captador → treinamento e acompanhamento em campo."});
    }
  }
  if(d.agg.pastas>0 && d.cac<=num(pr.cacMax) && d.receita>d.metaReceita*0.95 && d.roi>0){
    add({id:"R-ESCALA", grav:"ok", tema:"Investimento",
      oque:"Receita de "+brl(d.receita)+" com CAC de "+brl(d.cac)+", dentro do limite, e ROI de "+pct(d.roi,0)+".",
      porque:"O modelo se pagou no período medido e a meta de pastas foi praticamente atingida.",
      acao:"Levar à diretoria a proposta da primeira etapa de escala (de "+num(pr.numCaptadores)+" para "+(num(pr.numCaptadores)+3)+" captadores), com o orçamento simulado na aba Investimento.",
      resp:"CEO", prazo:10, ind:"Etapa de escala aprovada e CAC mantido ≤ "+brl(pr.cacMax)+" após 30 dias",
      regra:"SE receita ≥ meta e CAC ≤ limite → propor expansão."});
  }
  const pend = (s.compliance.itens||[]).filter(c=>c.status!=="concluido");
  if(pend.length && d.agg.dias>0){
    add({id:"R-COMPLIANCE", grav:"crit", tema:"Compliance",
      oque:pend.length+" validação"+(pend.length>1?"ões":"")+" obrigatória"+(pend.length>1?"s":"")+" ainda em aberto com o piloto já em operação.",
      porque:"Pendente: "+pend.slice(0,3).map(c=>c.item).join("; ")+(pend.length>3?" e outras":"")+".",
      acao:"Concluir as validações pendentes na aba O Projeto → Compliance, com responsável e documento anexado para cada uma.",
      resp:"CEO", prazo:5, ind:"Nenhuma validação obrigatória em aberto",
      regra:"SE o piloto está rodando com compliance pendente → concluir antes de qualquer expansão."});
  }
  const ordem = {crit:0, warn:1, ok:2};
  recs.sort((a,b)=>ordem[a.grav]-ordem[b.grav]);
  return recs;
}

function pontoAtencao(){
  const r = motor().filter(x=>x.grav!=="ok")[0];
  if(r) return r.oque;
  const d = D();
  if(d.agg.dias===0) return "Nenhum desvio detectado — o piloto ainda não teve dias registrados no diário, então não há resultado para comparar com o plano.";
  return "Nenhum desvio relevante nos indicadores medidos até aqui.";
}
function principalOportunidade(){
  const r = motor().filter(x=>x.grav==="ok")[0];
  if(r) return r.oque+" "+r.acao;
  const d = D();
  const bons = (S().territorios.locais||[]).filter(l=>localScore(l)>=65);
  if(bons.length) return bons.length+" local(is) com score alto ainda não testados em campo: "+bons.slice(0,3).map(l=>l.nome).join(", ")+".";
  return "Ainda não há dados suficientes para apontar uma oportunidade com números.";
}

  const val = v==null? "" : (o.t==="num"? String(v).replace(".",",") : v);
  return '<input class="f '+(o.t==="num"?"mono ":"")+(o.cls||"")+'" type="'+type+'" data-b="'+path+'" data-t="'+(o.t||"str")+'" value="'+esc(val)+'" placeholder="'+esc(o.ph||"")+'"'+(o.style?' style="'+o.style+'"':'')+'>';
}
function ta(path, o){
  o=o||{};
  return '<textarea class="f" data-b="'+path+'" data-t="str" rows="'+(o.rows||3)+'" placeholder="'+esc(o.ph||"")+'">'+esc(get(S(),path)||"")+'</textarea>';

  o=o||{};

}

function spread(total, n){
  const base = Math.floor(total/n), out = new Array(n).fill(base);
  let rest = total - base*n, i=0;
  while(rest>0){ out[i%n]++; rest--; i+=3; }
  return out;
}

function clearDemo(){

  s.piloto.diario = strip(s.piloto.diario);
  s.decisoes.lista = strip(s.decisoes.lista);
  s.pesquisa.visitas = strip(s.pesquisa.visitas);
  s.piloto.config.inicio=""; s.piloto.config.fim="";
  (g.demoInvest||[]).forEach(r=>{ const it=s.investimento.itens.find(x=>x.id===r.id); if(it){ it.realizado=r.prev; it.status="nao_iniciado"; }});
  const tset = new Set(g.demoTasks||[]);
  s.fases.lista.forEach(f=>{ (f.tarefas||[]).forEach(tk=>{ if(tset.has(tk.id)){ tk.status="nao_iniciado"; tk.concluidoEm=""; }});
    const ts=f.tarefas||[], dn=ts.filter(x=>x.status==="concluido").length;
    f.status = dn===0?"nao_iniciado": dn===ts.length?"concluido":"em_andamento"; });
  const mset = new Set(g.demoMarcos||[]);
  s.marcos.lista.forEach(m=>{ if(mset.has(m.id)){ m.status="nao_iniciado"; m.data=""; }});
  const SH = num(g.demoShift);
  if(SH>0){
    s.premissas.dataInicio = addDays(s.premissas.dataInicio, SH);
    s.fases.lista.forEach(f=>{ f.inicio=addDays(f.inicio,SH); f.fim=addDays(f.fim,SH);
      (f.tarefas||[]).forEach(tk=>{ if(tk.prazo) tk.prazo=addDays(tk.prazo,SH); }); });
    g.demoShift = 0;
  }
  s.compliance.itens.forEach(c=>{ if(c._demoDone){ c.status="nao_iniciado"; c.responsavel=""; c.data=""; delete c._demoDone; }});
  s.acoes.lista = s.acoes.lista.filter(a=>a.origem!=="motor");
  s.acoes.recusadas = [];
  g.demo=false; g.demoTasks=[]; g.demoMarcos=[]; g.demoInvest=[]; g.causas=[];

  Store.saveAll(); App.render(); toast("Dados DEMO removidos.");
}

      kpi("CAC", d.agg.pastas? brl(d.cac):"—", "limite "+brl(d.pr.cacMax), d.semCac==="idle"?"":d.semCac)+
      kpi("Receita", brl(d.receita), "meta "+brl(d.metaReceita))+
      kpi("ROI", d.invReal? pct(d.roi,0):"—", "sobre "+brl(d.invReal)+" investidos", d.semRoi==="idle"?"":d.semRoi)+

        : '<div class="empty">Todas as tarefas do plano estão concluídas.</div>')+
    '</section>'+
    '<section class="card"><div class="blk-h"><h2>O que está atrasado</h2>'+(d.late?'<span class="pill crit"><i class="dot"></i>'+d.late+' vencida'+(d.late>1?"s":"")+'</span>':'<span class="pill ok"><i class="dot"></i>em dia</span>')+'</div>'+

/* ---------------- 04 PLANO DE AÇÃO (checklist master) ---------------- */
App.view_plano = function(){
  const s=S(), d=D(), f=App.filtro;
  const t = today();
  let itens = [];
  s.fases.lista.forEach((fa,fi)=> (fa.tarefas||[]).forEach((tk,ti)=> itens.push({fa,fi,tk,ti})));
  const filtros = [["todas","Todas"],["pendentes","Pendentes"],["andamento","Em andamento"],["concluidas","Concluídas"],["atrasadas","Atrasadas"],["proximas","Próximos 14 dias"]];
  const match = x => {
    if(f==="pendentes") return x.tk.status!=="concluido";
    if(f==="andamento") return x.tk.status==="em_andamento";
    if(f==="concluidas") return x.tk.status==="concluido";
    if(f==="atrasadas") return x.tk.status!=="concluido" && x.tk.prazo && x.tk.prazo<t;
    if(f==="proximas") return x.tk.status!=="concluido" && x.tk.prazo && x.tk.prazo>=t && daysBetween(t,x.tk.prazo)<=14;
    return true;
  };
  const vis = itens.filter(match);
  const resp = {};
  itens.forEach(x=>{ const r=(x.tk.responsavel||"Sem responsável"); if(!resp[r]) resp[r]={t:0,d:0,a:0}; resp[r].t++; if(x.tk.status==="concluido") resp[r].d++; else if(x.tk.prazo&&x.tk.prazo<t) resp[r].a++; });

  let h = head("04 · Execução","Tudo que precisa ser feito","Todas as tarefas das 11 fases em uma lista só. Marque o que foi concluído — a data é registrada automaticamente.");
  h += '<div class="kpis g4" style="margin-bottom:18px">'+
    kpi("Total", String(d.tot))+kpi("Concluídas", String(d.done), bar(d.progresso,"ok"))+
    kpi("Em andamento", String(d.doing))+kpi("Atrasadas", String(d.late), d.late?"prazo vencido":"nenhuma", d.late?"crit":"ok")+'</div>';
  h += '<div class="tabs">'+filtros.map(x=>'<button data-act="filtro" data-f="'+x[0]+'" class="'+(f===x[0]?"on":"")+'">'+x[1]+'</button>').join("")+'</div>';

  if(!vis.length) h += '<div class="empty">Nenhuma tarefa neste filtro.</div>';
  else {
    let lastF = -1;
    h += vis.map(x=>{
      let pre = "";
      if(x.fi!==lastF){ lastF=x.fi; pre = '<div class="lbl" style="margin:16px 0 8px">Fase '+x.fa.num+' — '+esc(x.fa.nome)+'</div>'; }
      const tb = "fases.lista."+x.fi+".tarefas."+x.ti, done = x.tk.status==="concluido";
      const late = !done && x.tk.prazo && x.tk.prazo<t;
      return pre+'<div class="chk'+(done?" done":"")+'"'+(late?' style="border-color:color-mix(in srgb,var(--crit) 40%,transparent)"':'')+'>'+
        '<input type="checkbox" '+(done?"checked":"")+' data-act="toggle" data-fi="'+x.fi+'" data-id="'+x.tk.id+'">'+
        '<div class="t"><div class="ti">'+inp(tb+".titulo")+'</div>'+
        '<div class="meta">'+inp(tb+".responsavel",{ph:"responsável"})+inp(tb+".prazo",{type:"date"})+sel(tb+".status",STATUS_OPTS)+inp(tb+".obs",{ph:"observação"})+
        (late?'<span class="pill crit"><i class="dot"></i>vencida</span>':'')+(x.tk.concluidoEm?'<span class="tag">✓ '+fmtDate(x.tk.concluidoEm)+'</span>':'')+'</div></div>'+
        '<button class="btn sm ghost danger" data-act="delTarefa" data-fi="'+x.fi+'" data-id="'+x.tk.id+'">✕</button></div>';
    }).join("");
  }

  h += '<section class="blk" style="margin-top:28px"><div class="blk-h"><h2>Por responsável</h2></div><div class="tw"><table><thead><tr><th>Responsável</th><th class="num">Tarefas</th><th class="num">Concluídas</th><th class="num">Atrasadas</th><th style="min-width:160px">Avanço</th></tr></thead><tbody>'+
    Object.keys(resp).sort().map(r=>{const o=resp[r];const p=Math.round(o.d/o.t*100);
      return '<tr><td>'+esc(r)+'</td><td class="num">'+o.t+'</td><td class="num">'+o.d+'</td><td class="num"'+(o.a?' style="color:var(--crit)"':'')+'>'+o.a+'</td><td>'+bar(p,p===100?"ok":"")+'</td></tr>';}).join("")+
    '</tbody></table></div></section>';
  return h;
};

const TIPO_LOCAL = ["Hospital","Pronto-socorro","Clínica de fisioterapia","Clínica de reabilitação","Agência INSS","Perícia médica","Terminal","Sindicato","Outro"];
App.view_territorios = function(){
  const s=S(), tab=T("territorios","locais");
  let h = head("05 · Inteligência territorial","Territórios","Descobrir onde vale a pena testar antes de colocar gente na rua. O score é calculado a partir dos cinco critérios avaliados.");
  h += tabsHtml("territorios",[["locais","Locais candidatos"],["pesquisa","Pesquisa de campo"],["ranking","Ranking"]],tab);

  const locais = s.territorios.locais;
  if(tab==="locais"){
    h += '<section class="blk"><div class="blk-h"><h2>Locais avaliados</h2><button class="btn sm primary" data-act="add" data-list="territorios.locais" data-tpl="local">+ Local</button></div>';
    if(!locais.length) h += '<div class="empty">Nenhum local cadastrado ainda. Comece pelos hospitais, prontos-socorros, clínicas de fisioterapia e agências do INSS da praça.</div>';
    else {
      h += '<div class="tw"><table><thead><tr><th>Local</th><th>Cidade / Região</th><th>Tipo</th><th class="num" title="1 a 5">Fluxo</th><th class="num" title="1 a 5">Prox. hospitalar</th><th class="num" title="1 a 5">Perfil</th><th class="num" title="1 a 5">Segurança</th><th class="num" title="1 a 5">Operacional</th><th class="num">Score</th><th>Classificação</th><th></th></tr></thead><tbody>'+
      locais.map((l,i)=>{const b="territorios.locais."+i, sc=localScore(l), cl=localClass(sc);
        return '<tr><td style="min-width:170px">'+inp(b+".nome",{ph:"nome do local"})+'</td>'+
        '<td style="min-width:150px">'+inp(b+".regiao",{ph:"região"})+'</td>'+
        '<td>'+sel(b+".tipo",TIPO_LOCAL)+'</td>'+
        ["fluxo","hospital","perfil","seguranca","operacional"].map(k=>'<td class="num" style="width:64px">'+inp(b+"."+k,{t:"num",type:"number"})+'</td>').join("")+
        '<td class="num"><span class="score">'+sc+'</span></td><td>'+semPill(cl.c,cl.l)+'</td><td>'+delBtn("territorios.locais",l.id)+'</td></tr>'+
        '<tr><td colspan="11" style="padding-top:0;border-bottom:2px solid var(--line)"><div class="grid g3">'+
          field("Endereço", inp(b+".endereco"))+field("Justificativa", inp(b+".justificativa",{ph:"por que este ponto"}))+field("Observações", inp(b+".obs"))+
        '</div></td></tr>';}).join("")+
      '</tbody></table></div>'+
      '<p class="tiny dim" style="margin-top:10px">Score = fluxo (30%) + proximidade hospitalar (20%) + perfil do público (25%) + segurança (10%) + facilidade operacional (15%), cada critério de 1 a 5. Acima de 80 EXCELENTE · 65 ALTO · 50 TESTAR · 35 BAIXO · abaixo disso DESCARTAR.</p>';
    }
    h += '</section>';
  }

  if(tab==="pesquisa"){
    const v = s.pesquisa.visitas;
    h += '<section class="blk"><div class="blk-h"><h2>Visitas de campo</h2><button class="btn sm primary" data-act="add" data-list="pesquisa.visitas" data-tpl="visita">+ Visita</button></div>';
    if(!v.length) h += '<div class="empty">Nenhuma visita registrada. É esta etapa que transforma hipótese em evidência.</div>';
    else h += '<div class="tw"><table><thead><tr><th>Data</th><th>Local</th><th>Horário</th><th>Responsável</th><th class="num">Fluxo obs.</th><th class="num">Abordadas</th><th class="num">Conversas</th><th class="num">Interesses</th><th class="num">Leads</th><th class="num">Aproveit.</th><th>Observações</th><th></th></tr></thead><tbody>'+
      v.map((x,i)=>{const b="pesquisa.visitas."+i, ap = num(x.abordadas)? num(x.leads)/num(x.abordadas)*100:0;
        return '<tr><td>'+inp(b+".data",{type:"date"})+'</td><td style="min-width:150px">'+inp(b+".local")+'</td><td style="width:110px">'+inp(b+".horario",{ph:"14h–18h"})+'</td><td>'+inp(b+".responsavel")+'</td>'+
        ["fluxo","abordadas","conversas","interesses","leads"].map(k=>'<td class="num" style="width:76px">'+inp(b+"."+k,{t:"num",type:"number"})+'</td>').join("")+
        '<td class="num">'+pct(ap,1)+'</td><td style="min-width:200px">'+inp(b+".obs")+'</td><td>'+delBtn("pesquisa.visitas",x.id)+'</td></tr>';}).join("")+
      '</tbody></table></div>';
    h += '</section>';
    const porLocal = {};
    v.forEach(x=>{const k=(x.local||"—").trim(); if(!porLocal[k]) porLocal[k]={local:k,ab:0,leads:0,fluxo:0,n:0};
      const o=porLocal[k]; o.ab+=num(x.abordadas); o.leads+=num(x.leads); o.fluxo+=num(x.fluxo); o.n++;});
    const arr = Object.values(porLocal).map(o=>{o.ap = o.ab? o.leads/o.ab*100:0; return o;}).sort((a,b)=>b.ap-a.ap);
    if(arr.length){
      const max = Math.max.apply(null, arr.map(o=>o.ap).concat([1]));
      h += '<section class="blk"><div class="blk-h"><h2>Potencial observado em campo</h2><span class="hint">leads gerados ÷ pessoas abordadas</span></div><div class="card">'+
        arr.map(o=>'<div style="display:grid;grid-template-columns:180px 1fr 70px;gap:12px;align-items:center;padding:7px 0"><span style="font-weight:500">'+esc(o.local)+'</span>'+bar(o.ap/max*100, o.ap>=20?"ok":o.ap>=10?"warn":"crit")+'<span class="mono" style="text-align:right">'+pct(o.ap,1)+'</span></div>').join("")+
        '</div></section>';
    }
  }

  if(tab==="ranking"){
    const arr = locais.map(l=>({l, sc:localScore(l)})).sort((a,b)=>b.sc-a.sc);
    if(!arr.length) h += '<div class="empty">Cadastre locais na aba anterior para ver o ranking.</div>';
    else h += '<section class="blk"><div class="blk-h"><h2>Ranking dos locais por score</h2><span class="hint">os '+num(S().premissas.numLocais)+' primeiros são os candidatos naturais ao piloto</span></div><div class="card">'+
      arr.map((x,i)=>{const cl=localClass(x.sc);
        return '<div style="display:grid;grid-template-columns:26px 1fr 190px 100px 96px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)">'+
        '<span class="mono dim">'+(i+1)+'</span><span style="font-weight:500">'+esc(x.l.nome||"(sem nome)")+'<span class="dim tiny"> · '+esc(x.l.tipo||"")+'</span></span>'+
        bar(x.sc, cl.c==="ok"?"ok":cl.c==="warn"?"warn":cl.c==="crit"?"crit":"")+
        '<span class="mono" style="text-align:right">'+x.sc+' / 100</span>'+semPill(cl.c,cl.l)+'</div>';}).join("")+
      '</div></section>';
  }
  return h;
};

App.view_piloto = function(){

    h += '<section class="blk"><div class="card"><div class="grid g3">'+

      kpi("Leads", int(d.metaLeads))+kpi("Qualificados", int(d.metaQualificados))+
      kpi("Triagens", int(d.metaTriagens))+kpi("Pastas", int(d.metaPastas))+
      kpi("Receita esperada", brl(d.metaReceita))+kpi("Orçamento", brl(d.orcamento))+
      kpi("CAC máximo", brl(d.pr.cacMax))+kpi("Dias registrados", String(d.agg.dias))+

  if(tab==="diario"){
    const dl = s.piloto.diario;
    h += '<section class="blk"><div class="blk-h"><h2>Diário do piloto</h2><button class="btn sm primary" data-act="add" data-list="piloto.diario" data-tpl="diario">+ Registro</button></div>'+
      '<p class="tiny dim" style="margin-bottom:10px">Preencha diária ou semanalmente. O custo do dia é a parte variável da operação (remuneração e deslocamento dos captadores) e entra no investimento realizado — não repita esses valores na aba Investimento.</p>';
    if(!dl.length) h += '<div class="empty">Nenhum registro ainda. Um registro por dia e por local é o suficiente.</div>';
    else h += '<div class="tw"><table><thead><tr><th>Data</th><th>Local</th><th class="num">Captadores</th><th class="num">Leads</th><th class="num">Qualif.</th><th class="num">Triagens</th><th class="num">Pastas</th><th class="num">Custo do dia</th><th>Observações</th><th></th></tr></thead><tbody>'+
      dl.map((x,i)=>{const b="piloto.diario."+i;
        return '<tr><td style="width:130px">'+inp(b+".data",{type:"date"})+'</td><td style="min-width:150px">'+inp(b+".local",{ph:"local"})+'</td>'+
        ["captadores","leads","qualificados","triagens","pastas","investimento"].map(k=>'<td class="num" style="width:84px">'+inp(b+"."+k,{t:"num",type:"number"})+'</td>').join("")+
        '<td style="min-width:180px">'+inp(b+".obs")+'</td><td>'+delBtn("piloto.diario",x.id)+'</td></tr>';}).join("")+
      '<tr style="background:var(--surface-2);font-weight:600"><td colspan="3">Total — '+d.agg.dias+' registros</td>'+
      '<td class="num">'+int(d.agg.leads)+'</td><td class="num">'+int(d.agg.qualificados)+'</td><td class="num">'+int(d.agg.triagens)+'</td><td class="num">'+int(d.agg.pastas)+'</td><td class="num">'+brl(d.agg.custo)+'</td><td colspan="2"></td></tr>'+
      '</tbody></table></div>';
    h += '</section>';
  }

  if(tab==="resultado"){
    const rows = [
      ["Leads", d.metaLeads, d.agg.leads, int, true],
      ["Qualificados", d.metaQualificados, d.agg.qualificados, int, true],
      ["Triagens", d.metaTriagens, d.agg.triagens, int, true],
      ["Pastas", d.metaPastas, d.agg.pastas, int, true],
      ["Investimento", d.orcamento, d.invReal, brl, false],
      ["Receita", d.metaReceita, d.receita, brl, true]
    ];
    h += '<section class="blk"><div class="blk-h"><h2>Planejado x realizado</h2><span class="hint">'+d.agg.dias+' dias registrados</span></div><div class="cmp">'+
      '<div class="row head"><span>Indicador</span><span>Realizado sobre a meta</span><span class="num">Planejado</span><span class="num">Realizado</span><span class="num">Variação</span></div>'+
      rows.map(r=>{
        const meta=num(r[1]), real=num(r[2]);
        const p = meta? real/meta*100 : 0;
        const varia = meta? (real/meta-1)*100 : 0;
        const good = r[4]? (p>=95?"ok":p>=80?"warn":"crit") : (real<=meta?"ok": real<=meta*1.1?"warn":"crit");
        return '<div class="row"><span class="nm">'+r[0]+'</span>'+bar(clamp(p,0,100), good, 100)+
          '<span class="num dim">'+r[3](meta)+'</span><span class="num">'+r[3](real)+'</span>'+
          '<span class="num" style="color:var(--'+(good==="ok"?"ok":good==="warn"?"warn":"crit")+')">'+(varia>=0?"+":"")+pct(varia,0)+'</span></div>';
      }).join("")+'</div></section>';
    h += '<div class="kpis g4">'+
      kpi("CAC", d.agg.pastas?brl(d.cac):"—","limite "+brl(d.pr.cacMax), d.semCac==="idle"?"":d.semCac)+
      kpi("ROI", d.invReal?pct(d.roi,0):"—","receita − investimento ÷ investimento", d.semRoi==="idle"?"":d.semRoi)+
      kpi("Pastas por captador", d.prodCaptador.toFixed(1), "meta "+(num(d.pr.metaPastasCaptadorMes)*(num(d.pr.duracaoPiloto)/30)).toFixed(1))+
      kpi("Conversão lead → pasta", pct(d.convLeadPasta,1), int(d.agg.leads)+" leads → "+int(d.agg.pastas)+" pastas")+
    '</div>';
    if(d.locais.length){
      h += '<section class="blk" style="margin-top:22px"><div class="blk-h"><h2>Desempenho por local</h2><span class="hint">CAC direto = custo do dia registrado ÷ pastas do local</span></div>'+
        '<div class="tw"><table><thead><tr><th>Local</th><th class="num">Dias</th><th class="num">Leads</th><th class="num">Pastas</th><th class="num">Conversão</th><th class="num">Custo</th><th class="num">CAC direto</th><th class="num">Receita</th><th>Situação</th></tr></thead><tbody>'+
        d.locais.map(l=>{const c = l.cac===0?"idle": l.cac<=num(d.pr.cacMax)?"ok": l.cac<=num(d.pr.cacMax)*1.2?"warn":"crit";
          return '<tr><td><strong>'+esc(l.local)+'</strong></td><td class="num">'+l.dias+'</td><td class="num">'+int(l.leads)+'</td><td class="num">'+int(l.pastas)+'</td><td class="num">'+pct(l.conv,1)+'</td><td class="num">'+brl(l.custo)+'</td><td class="num">'+(l.cac?brl(l.cac):"—")+'</td><td class="num">'+brl(l.receita)+'</td><td>'+semPill(c, c==="ok"?"Dentro do limite":c==="warn"?"Atenção":c==="crit"?"Acima do limite":"Sem pasta")+'</td></tr>';}).join("")+
        '</tbody></table></div></section>';
    }
  }
  return h;
};

const CATS = ["Pessoas","Equipamentos","Material","Tecnologia","Transporte","Treinamento","Outros"];
App.view_investimento = function(){
  const s=S(), d=D(), tab=T("investimento","orcamento");
  let h = head("08 · Dinheiro","Investimento","Quanto o projeto previu gastar, quanto de fato gastou e o que isso significa em cenários de escala.");
  h += tabsHtml("investimento",[["orcamento","Orçamento"],["modelo","Modelo financeiro"],["escala","Projeção de escala"]],tab);

  if(tab==="orcamento"){
    const itens = s.investimento.itens;
    const porCat = {};
    itens.forEach(i=>{ const c=i.categoria||"Outros"; if(!porCat[c]) porCat[c]={prev:0,real:0}; porCat[c].prev+=num(i.previsto); porCat[c].real+=num(i.realizado); });

      kpi("Realizado", brl(d.invReal), "inclui "+brl(d.agg.custo)+" do diário do piloto")+
      kpi("Desvio", (desvio>=0?"+":"")+brl(desvio), pct(safeDiv(desvio,d.orcamento)*100,0)+" do orçamento", d.semOrc==="idle"?"":d.semOrc)+

      '<div class="tw"><table><thead><tr><th>Categoria</th><th>Item</th><th class="num">Previsto</th><th class="num">Realizado</th><th class="num">Diferença</th><th>Status</th><th>Observação</th><th></th></tr></thead><tbody>'+
      itens.map((it,i)=>{const b="investimento.itens."+i, dif=num(it.realizado)-num(it.previsto);

        '<td class="num" style="width:110px">'+inp(b+".previsto",{t:"num",type:"number"})+'</td>'+
        '<td class="num" style="width:110px">'+inp(b+".realizado",{t:"num",type:"number"})+'</td>'+
        '<td class="num"'+(dif>0?' style="color:var(--crit)"':dif<0?' style="color:var(--ok)"':'')+'>'+(dif>0?"+":"")+brl(dif)+'</td>'+
        '<td>'+sel(b+".status",STATUS_OPTS)+'</td><td>'+inp(b+".obs")+'</td><td>'+delBtn("investimento.itens",it.id)+'</td></tr>';}).join("")+
      '<tr style="background:var(--surface-2);font-weight:600"><td colspan="2">Total das linhas</td><td class="num">'+brl(d.invPrev)+'</td><td class="num">'+brl(d.invReal-d.agg.custo)+'</td><td class="num"></td><td colspan="3"></td></tr>'+
      '<tr style="background:var(--surface-2);font-weight:600"><td colspan="2">+ custo variável registrado no diário</td><td class="num">—</td><td class="num">'+brl(d.agg.custo)+'</td><td colspan="4"></td></tr>'+
      '</tbody></table></div></section>';
    h += '<section class="blk"><div class="blk-h"><h2>Por categoria</h2></div><div class="card">'+
      Object.keys(porCat).map(c=>{const o=porCat[c], p = o.prev? o.real/o.prev*100:0;
        return '<div style="display:grid;grid-template-columns:130px 1fr 100px 100px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)"><span style="font-weight:500">'+esc(c)+'</span>'+
        bar(clamp(p,0,100), p>105?"crit":p>100?"warn":"ok",100)+'<span class="mono dim" style="text-align:right">'+brl(o.prev)+'</span><span class="mono" style="text-align:right">'+brl(o.real)+'</span></div>';}).join("")+
      '</div></section>';
  }

  if(tab==="modelo"){
    const pr=d.pr;
    const cenarios = [["Conservador",0.7,"crit"],["Base",1,""],["Otimista",1.3,"ok"]];
    h += '<section class="blk"><div class="blk-h"><h2>Simulador</h2><span class="hint">altere as premissas e os três cenários se recalculam</span></div>'+
      '<div class="card"><div class="grid g4">'+
        field("Captadores", inp("premissas.numCaptadores",{t:"num",type:"number"}))+
        field("Pastas por captador / mês", inp("premissas.metaPastasCaptadorMes",{t:"num",type:"number"}))+
        field("Receita por pasta (R$)", inp("premissas.receitaPorPasta",{t:"num",type:"number"}))+
        field("Custo por captador / mês (R$)", inp("premissas.custoCaptadorMes",{t:"num",type:"number"}))+
      '</div></div></section>';
    h += '<div class="grid g3">'+cenarios.map(c=>{
      const pastasCap = num(pr.metaPastasCaptadorMes)*c[1];
      const pastas = pastasCap*num(pr.numCaptadores);
      const receita = pastas*num(pr.receitaPorPasta);
      const custo = num(pr.custoCaptadorMes)*num(pr.numCaptadores) + num(pr.custoFixoMes);
      const res = receita-custo;
      const cac = pastas? custo/pastas : 0;
      return '<section class="card"><div class="blk-h"><h2>'+c[0]+'</h2><span class="tag">'+(c[1]*100).toFixed(0)+'% da meta</span></div>'+
        '<div style="display:grid;gap:7px;margin-top:6px">'+
        [["Pastas por captador", pastasCap.toFixed(1)],["Pastas totais / mês", pastas.toFixed(1)],
         ["Receita / mês", brl(receita)],["Custo / mês", brl(custo)],
         ["Resultado / mês", '<strong style="color:var(--'+(res>=0?"ok":"crit")+')">'+brl(res)+'</strong>'],
         ["CAC", brl(cac)+' <span class="tiny dim">(limite '+brl(pr.cacMax)+')</span>']
        ].map(r=>'<div style="display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px"><span class="muted tiny">'+r[0]+'</span><span class="mono">'+r[1]+'</span></div>').join("")+
        '</div></section>';}).join("")+'</div>';
  }

  if(tab==="escala"){
    const pr=d.pr;
    const etapas=[2,5,10,20,50];
    h += '<section class="blk"><div class="blk-h"><h2>Projeção de escala</h2><span class="hint">cada etapa só é liberada com o critério da etapa anterior atingido</span></div>'+
      '<div class="tw"><table><thead><tr><th>Etapa</th><th class="num">Captadores</th><th class="num">Locais</th><th class="num">Investimento / mês</th><th class="num">Pastas / mês</th><th class="num">Receita / mês</th><th class="num">Resultado / mês</th><th class="num">CAC esperado</th><th>Critério para avançar</th></tr></thead><tbody>'+
      etapas.map((n,i)=>{
        const custo = n*num(pr.custoCaptadorMes)+num(pr.custoFixoMes);
        const pastas = n*num(pr.metaPastasCaptadorMes);
        const receita = pastas*num(pr.receitaPorPasta);
        const cac = pastas? custo/pastas : 0;
        const locais = Math.max(1, Math.ceil(n/ (num(pr.numCaptadores)||2) * num(pr.numLocais)));
        return '<tr><td><strong>Etapa '+(i+1)+'</strong></td><td class="num">'+n+'</td><td class="num">'+locais+'</td><td class="num">'+brl(custo)+'</td><td class="num">'+int(pastas)+'</td><td class="num">'+brl(receita)+'</td>'+
          '<td class="num" style="color:var(--'+(receita-custo>=0?"ok":"crit")+')">'+brl(receita-custo)+'</td><td class="num">'+brl(cac)+'</td>'+
          '<td class="tiny muted">'+(i===0?"Piloto com CAC ≤ "+brl(pr.cacMax):"CAC ≤ "+brl(pr.cacMax)+" por 30 dias na etapa "+i)+'</td></tr>';}).join("")+
      '</tbody></table></div>'+
      '<p class="tiny dim" style="margin-top:10px">A projeção usa o custo por captador e a meta de pastas das premissas, sem ganho de escala. Se houver diluição de custo fixo, ajuste “custo por captador / mês” para a etapa correspondente.</p></section>';
  }
  return h;
};

/* ---------------- 09 RESULTADOS ---------------- */
App.view_resultados = function(){
  const d=D();
  let h = head("09 · Entrega","O que o projeto entregou","Apenas o consolidado necessário para avaliar o canal. O detalhe de cada lead permanece no CRM da V3.");
  if(d.agg.dias===0) return h+'<div class="empty">Ainda não há dias registrados no diário do piloto. Assim que o primeiro registro entrar, este painel passa a ter números.</div>';
  const funil = [["Leads", d.agg.leads, d.metaLeads],["Qualificados", d.agg.qualificados, d.metaQualificados],["Triagens", d.agg.triagens, d.metaTriagens],["Pastas", d.agg.pastas, d.metaPastas]];
  const maxF = Math.max.apply(null, funil.map(f=>Math.max(num(f[1]),num(f[2]))).concat([1]));
  h += '<div class="kpis g4" style="margin-bottom:22px">'+
    kpi("Leads", int(d.agg.leads), "meta "+int(d.metaLeads))+
    kpi("Qualificados", int(d.agg.qualificados), pct(safeDiv(d.agg.qualificados,d.agg.leads)*100,1)+" dos leads")+
    kpi("Pastas", int(d.agg.pastas), "meta "+int(d.metaPastas), d.semPastas)+
    kpi("Receita", brl(d.receita), "meta "+brl(d.metaReceita))+
    kpi("CAC", brl(d.cac), "limite "+brl(d.pr.cacMax), d.semCac)+
    kpi("ROI", pct(d.roi,0), "investimento "+brl(d.invReal), d.semRoi)+
    kpi("Conversão lead → pasta", pct(d.convLeadPasta,1))+
    kpi("Produtividade", d.prodCaptador.toFixed(1), "pastas por captador")+
  '</div>';
  h += '<section class="blk"><div class="blk-h"><h2>Funil do canal</h2><span class="hint">barra = realizado · marca = meta do período</span></div><div class="card">'+
    funil.map(f=>'<div style="display:grid;grid-template-columns:130px 1fr 90px 80px;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)">'+
      '<span style="font-weight:500">'+f[0]+'</span>'+bar(num(f[1])/maxF*100, num(f[1])>=num(f[2])*0.95?"ok":num(f[1])>=num(f[2])*0.8?"warn":"crit", num(f[2])/maxF*100)+
      '<span class="mono" style="text-align:right">'+int(f[1])+'</span><span class="mono dim" style="text-align:right">meta '+int(f[2])+'</span></div>').join("")+
    '</div></section>';
  if(d.locais.length){
    const maxP = Math.max.apply(null, d.locais.map(l=>l.pastas).concat([1]));
    h += '<section class="blk"><div class="blk-h"><h2>Pastas por local</h2></div><div class="card">'+
      d.locais.map(l=>'<div style="display:grid;grid-template-columns:180px 1fr 70px 110px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)">'+
      '<span style="font-weight:500">'+esc(l.local)+'</span>'+bar(l.pastas/maxP*100, l.cac&&l.cac<=num(d.pr.cacMax)?"ok":l.cac?"warn":"")+
      '<span class="mono" style="text-align:right">'+int(l.pastas)+'</span><span class="mono dim" style="text-align:right">CAC '+(l.cac?brl(l.cac):"—")+'</span></div>').join("")+
      '</div></section>';
  }
  return h;
};

/* ---------------- 10 ANÁLISE ---------------- */
const CAUSAS = ["Baixo fluxo no local","Baixo volume de abordagem","Baixa conversão da abordagem","Baixa qualidade do lead","Problema de localização","Problema de equipe","Problema de processo","Problema de horário","Outro"];
App.view_analise = function(){
  const s=S(), d=D(), tab=T("analise","comparacao");

      ["Conversão lead → pasta", pct(num(d.pr.convLeadQualificado)*num(d.pr.convQualificadoTriagem)*num(d.pr.convTriagemPasta)/10000,1), pct(d.convLeadPasta,1), "idle", 0, ""],
      ["Pastas", int(d.metaPastas), int(d.agg.pastas), d.semPastas, safeDiv(d.agg.pastas-d.metaPastas,d.metaPastas)*100, "%"],
      ["Receita", brl(d.metaReceita), brl(d.receita), d.agg.dias? d.sem(d.receita,d.metaReceita,true):"idle", safeDiv(d.receita-d.metaReceita,d.metaReceita)*100, "%"],
      ["CAC", brl(d.pr.cacMax), d.agg.pastas?brl(d.cac):"—", d.semCac, safeDiv(d.cac-num(d.pr.cacMax),num(d.pr.cacMax))*100, "%"],

      rows.map(r=>{
        const lab = {ok:"Dentro da meta",warn:"Atenção",crit:"Fora da meta",idle:"Sem dados"}[r[3]]||"Sem dados";
        const v = r[5]? (r[4]>=0?"+":"")+ (r[5]==="pp"? r[4].toFixed(0)+" pp" : pct(r[4],0)) : "—";
        return '<tr><td><strong>'+r[0]+'</strong></td><td class="mono dim">'+r[1]+'</td><td class="mono">'+r[2]+'</td><td class="num">'+v+'</td><td>'+semPill(r[3]==="idle"?"idle":r[3], lab)+'</td></tr>';
      }).join("")+'</tbody></table></div>';
  }

  if(tab==="diagnostico"){
    const recs = motor().filter(r=>r.grav!=="ok");
    h += '<section class="blk"><div class="blk-h"><h2>O que os números estão dizendo</h2></div>';
    if(!recs.length && d.agg.dias===0) h += '<div class="empty">Sem dias registrados no diário, não há o que diagnosticar. Registre o piloto na seção 07.</div>';
    else if(!recs.length) h += '<div class="insight opp"><h3>Diagnóstico</h3><p>Nenhum desvio relevante. Todos os indicadores medidos estão dentro das faixas definidas nas premissas.</p></div>';
    else h += recs.map(r=>'<div class="insight att" style="margin-bottom:12px"><h3>'+esc(r.tema)+'</h3><p><strong>'+esc(r.oque)+'</strong></p><p class="muted" style="font-size:12.5px">'+esc(r.porque)+'</p></div>').join("");
    h += '</section>';
    h += '<section class="blk"><div class="blk-h"><h2>Possíveis causas</h2><span class="hint">marque o que o gestor observou em campo — isso fica registrado no dossiê</span></div><div class="card"><div class="grid g3">'+
      CAUSAS.map(c=>{const on=(s.geral.causas||[]).includes(c);
        return '<button class="chk" data-act="causa" data-c="'+esc(c)+'" style="width:100%;text-align:left;cursor:pointer;'+(on?'border-color:var(--accent);background:var(--accent-soft)':'')+'"><span style="font-size:14px">'+(on?"☑":"☐")+'</span><span class="t"><span class="ti">'+esc(c)+'</span></span></button>';}).join("")+
      '</div></div></section>';
  }

  if(tab==="gonogo"){
    const g = s.geral.goNoGo||{};

      ["Pastas", int(d.metaPastas), int(d.agg.pastas), d.semPastas],

      ["Receita", brl(d.metaReceita), brl(d.receita), d.agg.dias? d.sem(d.receita,d.metaReceita,true):"idle"],
      ["ROI", "> 0%", d.invReal?pct(d.roi,0):"—", d.semRoi],
      ["Prazo", d.progressoEsperado+"%", d.progresso+"%", d.semProg],

    ];
    const criticos = crit.filter(c=>c[3]==="crit").length, atencao = crit.filter(c=>c[3]==="warn").length, semDados = crit.filter(c=>c[3]==="idle").length;

    else if(criticos===0 && atencao<=1){ rec="ESCALAR"; recCls="ok"; recTxt="Os critérios definidos no início foram atingidos. A recomendação é aprovar a primeira etapa de escala, mantendo o mesmo critério de CAC para liberar a etapa seguinte."; }
    else if(criticos>=2){ rec="ENCERRAR"; recCls="crit"; recTxt="Dois ou mais critérios ficaram fora da meta. A recomendação é encerrar o canal nesta configuração — ou reiniciar o piloto com locais e modelo diferentes, tratando como um novo teste."; }
    else { rec="AJUSTAR"; recCls="warn"; recTxt="O canal mostrou resultado, mas fora de pelo menos um critério. A recomendação é executar um ciclo de ajuste de 14 dias e reavaliar antes de liberar investimento adicional."; }

    h += '<section class="blk"><div class="blk-h"><h2>Critérios de decisão</h2><span class="hint">definidos nas premissas, antes do resultado</span></div>'+
      '<div class="tw"><table><thead><tr><th>Critério</th><th class="num">Meta</th><th class="num">Realizado</th><th>Status</th></tr></thead><tbody>'+
      crit.map(c=>'<tr><td><strong>'+c[0]+'</strong></td><td class="num dim">'+c[1]+'</td><td class="num">'+c[2]+'</td><td>'+semPill(c[3]==="idle"?"idle":c[3], {ok:"Atingido",warn:"Atenção",crit:"Não atingido",idle:"Sem dados"}[c[3]])+'</td></tr>').join("")+
      '</tbody></table></div></section>';
    h += '<section class="blk"><div class="card" style="border-left:3px solid var(--'+(recCls==="ok"?"ok":recCls==="warn"?"warn":recCls==="crit"?"crit":"line-2")+')">'+
      '<div class="lbl">Recomendação do sistema</div>'+
      '<h2 style="font-size:26px;margin-top:8px;color:var(--'+(recCls==="ok"?"ok":recCls==="warn"?"warn":recCls==="crit"?"crit":"text")+')">'+rec+'</h2>'+
      '<p class="muted" style="margin-top:8px;max-width:70ch">'+esc(recTxt)+'</p></div></section>';
    h += '<section class="blk"><div class="blk-h"><h2>Decisão do CEO</h2></div><div class="card">'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px">'+
      [["ESCALAR","primary"],["AJUSTAR",""],["ENCERRAR",""]].map(x=>'<button class="btn '+(g.decisao===x[0]?"primary":"")+'" data-act="gono" data-v="'+x[0]+'">'+(g.decisao===x[0]?"✓ ":"")+x[0]+'</button>').join("")+
      '</div>'+
      (g.decisao? '<p class="muted" style="margin-bottom:12px">Decisão registrada: <strong>'+esc(g.decisao)+'</strong> em '+fmtDate(g.data)+'.</p>':'')+
      '<div class="grid g2">'+field("Quem decidiu", inp("geral.goNoGo.por"))+field("Data", inp("geral.goNoGo.data",{type:"date"}))+'</div>'+
      '<div style="margin-top:12px">'+field("Justificativa da decisão", ta("geral.goNoGo.justificativa",{rows:3}))+'</div>'+
      '</div></section>';
  }
  return h;
};

      '</tbody></table></div></section>';
    const pv={baixa:0,media:1,alta:2}, iv={baixo:0,medio:1,alto:2,critico:3};
    h += '<section class="blk"><div class="blk-h"><h2>Matriz de risco</h2><span class="hint">probabilidade × impacto</span></div>'+
      '<div class="tw"><table><thead><tr><th></th>'+IMP.map(x=>'<th class="num">'+x[1]+'</th>').join("")+'</tr></thead><tbody>'+
      PROB.slice().reverse().map(p=>'<tr><th style="background:var(--surface-2)">'+p[1]+'</th>'+
        IMP.map(im=>{
          const items = R.filter(r=>r.probabilidade===p[0] && r.impacto===im[0]);
          const sev = pv[p[0]]+iv[im[0]];
          const bgc = sev>=4?"var(--crit-soft)": sev>=3?"var(--warn-soft)": sev>=2?"var(--surface-2)":"transparent";
          return '<td style="background:'+bgc+';vertical-align:top;min-width:150px">'+(items.length? items.map(r=>'<div class="tiny" style="margin-bottom:4px">• '+esc(r.risco)+'</div>').join(""):'<span class="dim tiny">—</span>')+'</td>';
        }).join("")+'</tr>').join("")+
      '</tbody></table></div></section>';
  }
  return h;
};

    ["Equipe", s.equipe.pessoas.filter(p=>p.nome||p.funcao).map(p=>(p.nome||"—")+" — "+p.funcao).join("; ")+"."],

  open(){
    this.slides = this.build(); this.i=0; this.on=true;
    const r = $("#present-root");
    r.innerHTML = '<div class="present"><div class="present-body"><div class="slide" id="slide"></div></div>'+
      '<div class="present-foot"><button class="btn sm" id="p-prev">← Anterior</button>'+
      '<span class="pg" id="p-pg"></span>'+
      '<span style="display:flex;gap:6px"><button class="btn sm" id="p-next">Próximo →</button><button class="btn sm ghost" id="p-close">Sair</button></span></div></div>';
    $("#p-prev").onclick=()=>this.go(-1); $("#p-next").onclick=()=>this.go(1); $("#p-close").onclick=()=>this.close();
    this.draw();
  },
  draw(){
    const s = this.slides[this.i];
    $("#slide").innerHTML = '<div class="s-eyebrow">'+esc(s.e)+'</div>'+(s.h1?'<h1>'+esc(s.h1)+'</h1>':'')+(s.h2?'<h2>'+esc(s.h2)+'</h2>':'')+'<div class="s-body">'+s.b+'</div>';
    $("#p-pg").textContent = (this.i+1)+" / "+this.slides.length;
  },
  go(n){ this.i = clamp(this.i+n, 0, this.slides.length-1); this.draw(); },
  close(){ this.on=false; $("#present-root").innerHTML=""; },
  key(e){
    if(e.key==="ArrowRight"||e.key===" "||e.key==="PageDown"){ e.preventDefault(); this.go(1); }
    else if(e.key==="ArrowLeft"||e.key==="PageUp"){ e.preventDefault(); this.go(-1); }
    else if(e.key==="Escape"){ this.close(); }
  }
};

function quandoRelativo(iso){
  const min = Math.round((Date.now()-new Date(iso).getTime())/60000);
  if(min < 1) return "agora";
  if(min < 60) return "há "+min+" min";
  const h = Math.round(min/60); if(h < 24) return "há "+h+"h";
  return fmtDate(String(iso).slice(0,10));
}

/* ---------- carrega a biblioteca do Supabase, com CDN reserva ---------- */
function carregarSupabase(){
  return new Promise(function(resolve){
    if(window.supabase && window.supabase.createClient) return resolve(true);
    const urls = ["https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",
                  "https://unpkg.com/@supabase/supabase-js@2"];
    let i = 0;
    (function tenta(){
      if(i >= urls.length) return resolve(false);
      const sc = document.createElement("script");
      sc.src = urls[i++];
      sc.onload  = function(){ resolve(!!(window.supabase && window.supabase.createClient)); };
      sc.onerror = tenta;
      document.head.appendChild(sc);
    })();
  });
}
